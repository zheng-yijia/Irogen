name: Build iOS Unsigned IPA

on:
  workflow_dispatch:  # 手动触发
  push:
    branches: [main, master]

jobs:
  build-ios:
    runs-on: macos-latest  # 使用免费的 macOS 运行环境

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build frontend
        run: npm run build

      - name: Init Tauri iOS project
        run: npx tauri ios init

      - name: Disable code signing
        run: |
          # 禁用代码签名，确保能在无证书环境下构建
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' src-tauri/gen/apple/*.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "";/g' src-tauri/gen/apple/*.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = .*;/DEVELOPMENT_TEAM = "";/g' src-tauri/gen/apple/*.xcodeproj/project.pbxproj

      - name: Build iOS app
        run: |
          # 构建 .app 文件（预期会因签名失败而退出，但 .app 已生成）
          npm run tauri ios build -- --ci 2>&1 | tee build.log || true

          # 检查 .app 是否生成成功
          APP_PATH=$(find src-tauri/gen/apple -path "*/Products/Applications/*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ .app 文件未生成，构建失败"
            exit 1
          fi
          echo "✅ .app 文件已生成: $APP_PATH"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Package unsigned IPA
        run: |
          # 手动打包 IPA（标准 IPA 目录结构）
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          # 修正权限
          chmod -R 755 Payload/
          find Payload -type f -exec chmod 644 {} \;
          # 打包为 IPA
          zip -r -q MyApp-iOS-unsigned.ipa Payload/
          echo "✅ IPA 打包完成"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyApp-iOS-unsigned-ipa
          path: MyApp-iOS-unsigned.ipa
          retention-days: 30
