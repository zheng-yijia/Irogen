name: Build iOS Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, x86_64-apple-ios

      - name: Install dependencies
        run: |
          npm install -g pnpm @tauri-apps/cli
          pnpm install --no-frozen-lockfile || npm install

      - name: Build frontend
        run: |
          if [ -f "pnpm-lock.yaml" ]; then
            pnpm build
          elif npm run | grep -q "build"; then
            npm run build
          else
            echo "No build script found, skipping..."
          fi

      - name: Init Tauri iOS project
        run: |
          tauri ios init
          echo "🔍 检查 Tauri 初始化后的目录结构:"
          find . -name "project.pbxproj" || true

      - name: Update Tauri Node packages
        run: |
          echo "🔧 正在更新 Tauri Node.js 依赖..."
          pnpm add @tauri-apps/api@latest @tauri-apps/plugin-http@latest @tauri-apps/plugin-updater@latest @tauri-apps/plugin-notification@latest --save-exact
          echo "✅ 依赖更新完成"

      - name: Fix library name in Xcode project only
        run: |
          echo "🔧 正在统一 Xcode 工程中的库名称..."
          
          # 1. 从 app/Cargo.toml 提取库名称（如果存在）
          CARGO_TOML="app/Cargo.toml"
          if [ -f "$CARGO_TOML" ]; then
            CARGO_LIB_NAME=$(grep -A5 '^\[lib\]' "$CARGO_TOML" | grep 'name' | head -1 | sed 's/.*= *"//;s/".*//')
          fi
          
          if [ -z "$CARGO_LIB_NAME" ]; then
            echo "⚠️ 未在 $CARGO_TOML 中找到 [lib] name，使用默认值 'app'"
            CARGO_LIB_NAME="app"
          fi
          echo "📦 Cargo 库名称: $CARGO_LIB_NAME"
          
          # 2. 在 Xcode 工程中查找并替换库名称
          PBXPROJ_PATH=$(find . -name "project.pbxproj" | head -1)
          if [ -n "$PBXPROJ_PATH" ]; then
            # 将 Xcode 工程中所有出现的 "libapp.a" 或 "app" 库引用替换为实际名称
            sed -i '' "s/libapp\.a/lib${CARGO_LIB_NAME}.a/g" "$PBXPROJ_PATH"
            sed -i '' "s/libapp/lib${CARGO_LIB_NAME}/g" "$PBXPROJ_PATH"
            echo "✅ Xcode 工程库名称已更新为: lib${CARGO_LIB_NAME}.a"
          else
            echo "❌ 未找到 project.pbxproj 文件"
            exit 1
          fi

      - name: Disable code signing
        run: |
          PBXPROJ_PATH=$(find . -name "project.pbxproj" | head -1)
          
          if [ -z "$PBXPROJ_PATH" ]; then
            echo "❌ 错误: 找不到 project.pbxproj 文件！"
            exit 1
          fi
          
          echo "✅ 找到项目文件: $PBXPROJ_PATH"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBXPROJ_PATH"
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "";/g' "$PBXPROJ_PATH"
          sed -i '' 's/DEVELOPMENT_TEAM = .*;/DEVELOPMENT_TEAM = "";/g' "$PBXPROJ_PATH"
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES;/CODE_SIGNING_ALLOWED = NO;/g' "$PBXPROJ_PATH"
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' "$PBXPROJ_PATH"
          echo "✅ 代码签名设置已修改"

      - name: Build iOS app
        run: |
          tauri ios build --ci --no-sign --ignore-version-mismatches -- -- CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee build.log || true

          APP_PATH=$(find . -path "*/Products/Applications/*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo ""
            echo "=================================================================="
            echo "❌❌❌ 严重错误：iOS 构建失败！以下是构建日志的最后 50 行 ❌❌❌"
            echo "=================================================================="
            echo ""
            tail -50 build.log
            echo ""
            echo "=================================================================="
            echo "❌❌❌ 错误日志结束 ❌❌❌"
            echo "=================================================================="
            echo ""
            exit 1
          fi
          echo "✅ .app 文件已生成: $APP_PATH"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          chmod -R 755 Payload/
          find Payload -type f -exec chmod 644 {} \;
          zip -r -q MyApp-iOS-unsigned.ipa Payload/
          echo "✅ IPA 打包完成"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyApp-iOS-unsigned-ipa
          path: MyApp-iOS-unsigned.ipa
          retention-days: 30
